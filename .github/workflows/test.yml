name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Test
        run: pytest -q
      - name: The demo must build without a model or a GPU
        run: |
          sta demo /tmp/demo --no-serve
          sta status /tmp/demo
          sta export /tmp/demo
      - name: Check the browser bundle parses
        if: matrix.python == '3.11'
        run: node --check src/spatiotemporal_annotator/ui/app.js
